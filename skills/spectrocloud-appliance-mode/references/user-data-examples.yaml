## With Static IP

```yaml
#cloud-config
install:
  reboot: true

users:
  - name: kairos
    passwd: kairos
    groups: [sudo, admin]
    sudo: ALL=(ALL) NOPASSWD:ALL

stages:
  initramfs:
    - name: "Configure static IP"
      files:
        - path: /etc/systemd/network/10-static.network
          content: |
            [Match]
            Name=en*

            [Network]
            Address=192.168.1.100/24
            Gateway=192.168.1.1
            DNS=8.8.8.8
          permissions: 0644
          owner: 0
          group: 0

stylus:
  site:
    paletteEndpoint: api.spectrocloud.com
    edgeHostToken: <token>
    projectName: <project>
```
